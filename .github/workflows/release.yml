# Continuous delivery (docs/adr/0003): every merge to master runs CI and publishes the
# installable apps as a GitHub release tagged v<versionName>-build.<run number>.
name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: Publish release
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          if [ "$HAS_KEYSTORE" = "true" ]; then
            apk_note="signed with the project release key"
          else
            apk_note="signed with a throwaway debug key (no release keystore configured): uninstall the previous build before installing"
          fi
          cat > notes.md <<NOTES
          Automated build of ${GITHUB_SHA::7}.

          | File | Install |
          |---|---|
          | \`minicam-android.apk\` | Android 8.0+, release build, ${apk_note}. |
          | \`minicam-android-debug.apk\` | Android debug build (debuggable). |
          | \`minicam-ios-unsigned.ipa\` | iPhone, iOS 17+. Unsigned: re-sign and install with AltStore, Sideloadly or Xcode. |
          | \`minicam-ios-simulator.zip\` | iOS Simulator: unzip and \`xcrun simctl install booted MinicamApp.app\`. |
          NOTES
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "minicam ${version} (build ${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md
