# Tests, lint and installable builds for both apps (docs/adr/0003).
# Runs on every pull request; release.yml reuses it on merges to master.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      # Secrets are absent on fork PRs; the release APK then falls back to the debug key.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      # Caches Gradle and validates the committed wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Lint
        run: ./gradlew lintDebug
      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "MINICAM_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APKs
        env:
          MINICAM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MINICAM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MINICAM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease -PversionCode=${{ github.run_number }}
      - name: Collect APKs
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/dist/minicam-android.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/dist/minicam-android-debug.apk"
          if [ -z "${MINICAM_KEYSTORE_PATH:-}" ]; then
            echo "::warning::No release keystore secrets; the release APK is signed with a throwaway debug key."
          fi
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: ${{ runner.temp }}/dist/*.apk
          if-no-files-found: error

  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: MinicamKit tests
        working-directory: ios/MinicamKit
        run: swift test
      - name: Install XcodeGen (pinned, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate Xcode project
        working-directory: ios/MinicamApp
        run: xcodegen generate
      # No Apple signing identity in CI (docs/adr/0003): the device build is unsigned and must be
      # re-signed by the installer (AltStore, Sideloadly, Xcode); the simulator build runs as is.
      - name: Build for device (unsigned)
        working-directory: ios/MinicamApp
        run: |
          xcodebuild -project MinicamApp.xcodeproj -scheme MinicamApp -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd-device" \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} build
      - name: Build for simulator
        working-directory: ios/MinicamApp
        run: |
          xcodebuild -project MinicamApp.xcodeproj -scheme MinicamApp -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd-sim" \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} build
      - name: Package IPA and simulator app
        run: |
          mkdir -p "$RUNNER_TEMP/dist" "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/dd-device/Build/Products/Release-iphoneos/MinicamApp.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/dist/minicam-ios-unsigned.ipa" Payload)
          (cd "$RUNNER_TEMP/dd-sim/Build/Products/Release-iphonesimulator" && \
            zip -qry "$RUNNER_TEMP/dist/minicam-ios-simulator.zip" MinicamApp.app)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios
          path: |
            ${{ runner.temp }}/dist/*.ipa
            ${{ runner.temp }}/dist/*.zip
          if-no-files-found: error
