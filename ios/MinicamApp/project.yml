# XcodeGen spec (docs/adr/0001). Generate the project with `xcodegen generate`;
# MinicamApp.xcodeproj is not committed.
name: MinicamApp
options:
  bundleIdPrefix: dev.minicam
  deploymentTarget:
    iOS: "17.0"
packages:
  MinicamKit:
    path: ../MinicamKit
targets:
  MinicamApp:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: MinicamKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.minicam.mobile
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: minicam
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        # Narrowed at runtime by OrientationLock (landscape only while fullscreen, spec 004).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "minicam connects to your camera server on the local network."
    info:
      path: Info.plist
      properties:
        # Plain HTTP only to local hosts; ServerConfig enforces the same rule (docs/SECURITY.md).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.minicam.mobile.access-callback
            CFBundleURLSchemes: [minicam]
  MinicamAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MinicamApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.minicam.mobile.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MinicamApp:
    build:
      targets:
        MinicamApp: all
        MinicamAppUITests: [test]
    test:
      targets: [MinicamAppUITests]
